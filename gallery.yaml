# Write a short, attention-grabbing description of your project.
desc: >
  CamlCalendar - Interactive Terminal Calendar
  CamlCalendar is a terminal-based calendar application built in OCaml for 
  managing schedules directly from the command line. The calendar displays 
  monthly, weekly, and yearly views with color-coded days: today in red, 
  holidays in blue, and past days in gray. Users can navigate between months, 
  select any day to view, edit, and manage items through an interactive menu 
  system. The application supports user authentication with signup/login and 
  persistent JSON data storage. Key features include: Multiple view modes: 
  monthly grid, weekly schedule, and yearly overview. Date navigation: jump 
  to specific dates, navigate between months/weeks/years. Full file persistence 
  with automatic directory creation and user-specific data storage. And all 
  features are accessible through an intuitive terminal interface with keyboard 
  shortcuts and interactive prompts for seamless schedule management.